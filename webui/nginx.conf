server {
    listen 5899;
    server_name _;

    # Official Vibe-Trading web UI (built dist)
    root /usr/share/nginx/html;
    index index.html;

    # Static + SPA: basic-auth gated (the UI's own login is the engine API key)
    location / {
        auth_basic "Vibe Trading WebUI";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    # Engine API proxy — engine enforces its own Bearer API key (UI asks for it).
    # No basic auth here so the Authorization: Bearer header passes through.
    location ~ ^/(api|auth|sessions|swarm|qveris|settings|channels|mandate|live|upload|shadow-reports|scheduled-runs|options|correlation)(/|$) {
        proxy_pass http://vibe-trading-vibe-trading-1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;   # SSE streaming
        proxy_cache off;
    }

    # /runs/{id} is BOTH a SPA route and an API path:
    # - text/html requests → SPA
    # - API calls → engine
    location ~ ^/runs/[^/]+/?$ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://vibe-trading-vibe-trading-1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ~ ^/(runs|autonomous-runs|code|reports) {
        proxy_pass http://vibe-trading-vibe-trading-1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
