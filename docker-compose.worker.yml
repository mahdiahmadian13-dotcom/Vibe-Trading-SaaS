# ============================================================================
# Vibe-Trading SaaS — Remote Worker (connects to central Redis)
# ============================================================================
# Usage on remote server (copy the whole repo there, or just: worker/, shared/, this file, .env optional):
#   BROKER_URL=redis://CENTRAL_IP:6379/0 \
#   ENGINE_URL=http://CENTRAL_IP:8899 \
#   ENGINE_API_KEY=<vibe engine key> \
#   DATABASE_URL=postgresql+asyncpg://vt:PASS@CENTRAL_IP:5432/vibetrader \
#   WORKER_NAME=worker-eu-1 \
#   docker compose -f docker-compose.worker.yml up -d --build
#
# Scale to N workers on the same server:
#   docker compose -f docker-compose.worker.yml up -d --build --scale worker=3
# (each replica gets a unique name worker-<container-id> automatically)
#
# Redis/Postgres on the central server must be reachable from this host:
#   central .env: REDIS_BIND=0.0.0.0 + firewall rule for 6379 (ideally VPN/Tailscale or Redis ACL)
#   postgres published on 0.0.0.0:5432 with scram auth
# ============================================================================

services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - REDIS_URL=${BROKER_URL:?Set BROKER_URL=redis://CENTRAL_IP:6379}
      - WORKER_NAME=${WORKER_NAME:-}   # empty => auto worker-<hostname> (unique per replica)
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - WORKER_MAX_TASKS=${WORKER_MAX_TASKS:-100}
      - VIBE_ENGINE_URL=${ENGINE_URL:-http://CENTRAL_IP:8899}
      - VIBE_ENGINE_API_KEY=${ENGINE_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
    restart: always
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2.0}"
          memory: "${MEM_LIMIT:-2G}"
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; r=redis.Redis.from_url(os.environ['REDIS_URL']); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
