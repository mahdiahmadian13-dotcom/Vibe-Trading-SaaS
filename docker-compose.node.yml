# ============================================================================
# Vibe-Trading SaaS — Node (agent + workers) — runs on a JOINED server
# ============================================================================
# The agent pulls desired state from the control plane and scales the
# `worker` service accordingly. Both read their config from .env, which
# the agent rewrites from control-plane state on every reconcile pass.
#
# NOTE: the installer starts ONLY the agent; the agent itself brings up
# the worker service once .env is populated from control-plane state
# (avoids worker crash-loops with empty env on first boot).
# ============================================================================

services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - .env
    command: ["python", "/agent/main.py"]
    volumes:
      # drive the HOST docker daemon (compose CLI talks to the socket)
      - /var/run/docker.sock:/var/run/docker.sock
      # project dir (compose files + .env) — the agent runs compose commands here
      - ./:/agent-project
    working_dir: /agent-project
    restart: always

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=${BROKER_URL}
      - WORKER_NAME_PREFIX=${VT_SERVER_NAME}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - WORKER_MAX_TASKS=${WORKER_MAX_TASKS:-100}
      - VIBE_ENGINE_URL=${ENGINE_URL:-http://engine:8899}
      - VIBE_ENGINE_API_KEY=${ENGINE_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
    restart: always
    depends_on:
      engine:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2.0}"
          memory: "${MEM_LIMIT:-2G}"
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; r=redis.Redis.from_url(os.environ['REDIS_URL']); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Local engine (spec 002 full-node): built on-node from the pinned git commit
  # (image vibe-node-engine:local, built by provisioning). Sessions live on a
  # shared volume so worker pull-on-miss/write-through can read/write files.
  # ---------------------------------------------------------------------------
  engine:
    image: vibe-node-engine:local
    env_file:
      - engine.env
    environment:
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=1
    ports:
      - "127.0.0.1:8899:8899"   # loopback only — never publish the engine
    volumes:
      - vibe-sessions:/home/vibe/.vibe-trading
      # engine.env is injected as PLAIN env_file (above), NOT bind-mounted:
      # the container runs as `vibe` (uid 100) and a root-owned bind mount
      # with mode 600 is unreadable inside → PermissionError at startup.
    read_only: true
    tmpfs:
      - /tmp
      - /home/vibe/.cache
      - /home/vibe/.config
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8899/live')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  vibe-sessions:
