# ============================================================================
# Vibe-Trading SaaS — Central Server
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis — Central Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      # 127.0.0.1 only by default; set PUBLISH_REDIS=0.0.0.0 in .env to allow remote workers
      - "${PUBLISH_REDIS:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # PostgreSQL — Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    ports:
      # 127.0.0.1 only by default; set PUBLISH_PG=0.0.0.0 in .env to allow remote workers
      - "${PUBLISH_PG:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibetrader}
      POSTGRES_USER: ${POSTGRES_USER:-vt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vt}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "0.0.0.0:9001:9000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - default
      - engine_net

  # ---------------------------------------------------------------------------
  # Telegram Bot
  # ---------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - GATEWAY_URL=http://gateway:9000
      - TELEGRAM_WEBAPP_URL=${TELEGRAM_WEBAPP_URL:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_CHANNEL_URL=${TELEGRAM_CHANNEL_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Official Vibe-Trading WebUI (React dist + nginx, engine-key auth in UI)
  # ---------------------------------------------------------------------------
  webui:
    image: nginx:alpine
    volumes:
      - ./webui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webui/.htpasswd:/etc/nginx/.htpasswd:ro
      - /opt/Vibe-Trading/frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "0.0.0.0:5899:5899"
    networks:
      - default
      - engine_net
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ---------------------------------------------------------------------------
  # Worker (local)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      # WORKER_NAME unset => auto worker-<hostname> (unique per replica when scaling)
      - WORKER_NAME=${CENTRAL_WORKER_NAME:-}
      - WORKER_CONCURRENCY=${CENTRAL_WORKER_CONCURRENCY:-4}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vibetrader}
      - VIBE_ENGINE_URL=${VIBE_ENGINE_URL:-http://vibe-trading-vibe-trading-1:8899}
    networks:
      - default
      - engine_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  redis-data:
  pg-data:

networks:
  engine_net:
    external: true
    name: vibe-trading_default
