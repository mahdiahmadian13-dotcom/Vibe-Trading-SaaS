<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Trading — داشبورد</title>
<style>
:root {
  --bg: #0b0e14;
  --panel: #131722;
  --panel2: #1a2032;
  --border: #232b3f;
  --text: #e6e9f0;
  --muted: #8b93a7;
  --accent: #4f8cff;
  --accent2: #7c5cff;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn', 'Segoe UI', Tahoma, sans-serif; }
body { background:var(--bg); color:var(--text); min-height:100vh; }
a { color:var(--accent); text-decoration:none; }

/* ---------- Auth ---------- */
#auth { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
.auth-card { background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:36px 32px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
.logo { text-align:center; margin-bottom:28px; }
.logo .mark { font-size:44px; }
.logo h1 { font-size:22px; margin-top:8px; background:linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.logo p { color:var(--muted); font-size:13px; margin-top:4px; }
.tabs { display:flex; background:var(--panel2); border-radius:10px; padding:4px; margin-bottom:22px; }
.tabs button { flex:1; padding:10px; border:none; background:transparent; color:var(--muted); border-radius:8px; cursor:pointer; font-size:14px; font-family:inherit; transition:.2s; }
.tabs button.active { background:var(--accent); color:#fff; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
.field input { width:100%; padding:12px 14px; background:var(--panel2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:14px; font-family:inherit; outline:none; transition:.2s; }
.field input:focus { border-color:var(--accent); }
.btn-main { width:100%; padding:13px; border:none; border-radius:10px; background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; transition:.2s; }
.btn-main:hover { opacity:.9; }
.btn-main:disabled { opacity:.5; cursor:wait; }
.msg { margin-top:14px; padding:11px; border-radius:10px; font-size:13px; display:none; }
.msg.error { background:rgba(239,68,68,.12); color:#fca5a5; display:block; }
.msg.ok { background:rgba(34,197,94,.12); color:#86efac; display:block; }

/* ---------- App shell ---------- */
#app { display:none; height:100vh; }
header { display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:60px; background:var(--panel); border-bottom:1px solid var(--border); }
.hbrand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; }
.hbrand span.mark { font-size:24px; }
nav { display:flex; gap:6px; }
nav button { padding:9px 18px; border:none; background:transparent; color:var(--muted); border-radius:10px; cursor:pointer; font-size:14px; font-family:inherit; transition:.2s; }
nav button.active { background:var(--panel2); color:var(--text); }
.userbox { display:flex; align-items:center; gap:10px; }
.userbox .avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--accent2)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
.userbox .exit { color:var(--muted); cursor:pointer; font-size:13px; background:none; border:none; font-family:inherit; }
.userbox .exit:hover { color:var(--red); }

main { height:calc(100vh - 60px); overflow:hidden; }
.view { display:none; height:100%; }
.view.active { display:flex; }

/* ---------- Chat ---------- */
#view-chat { gap:0; }
.sessions { width:270px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; }
.sessions .head { padding:14px; }
.sessions .head button { width:100%; padding:11px; border:none; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; font-family:inherit; font-size:14px; }
.sess-list { flex:1; overflow-y:auto; padding:8px; }
.sess-item { padding:11px 12px; border-radius:10px; cursor:pointer; font-size:13.5px; color:var(--muted); transition:.15s; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sess-item:hover { background:var(--panel2); }
.sess-item.active { background:var(--panel2); color:var(--text); border:1px solid var(--border); }
.chat-col { flex:1; display:flex; flex-direction:column; min-width:0; }
.chat-log { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px; }
.bubble { max-width:72%; padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.9; white-space:pre-wrap; word-wrap:break-word; }
.bubble.user { align-self:flex-start; background:linear-gradient(135deg, var(--accent), var(--accent2)); border-bottom-right-radius:4px; }
.bubble.bot { align-self:flex-end; background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:4px; }
.bubble.typing { color:var(--muted); font-size:13px; }
.chat-input { display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--border); background:var(--panel); }
.chat-input textarea { flex:1; resize:none; padding:12px 14px; background:var(--panel2); border:1px solid var(--border); border-radius:12px; color:var(--text); font-family:inherit; font-size:14px; outline:none; max-height:120px; }
.chat-input textarea:focus { border-color:var(--accent); }
.chat-input button { padding:0 26px; border:none; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; font-family:inherit; font-size:14px; }
.chat-input button:disabled { opacity:.5; }
.empty-hint { margin:auto; text-align:center; color:var(--muted); }
.empty-hint .big { font-size:46px; margin-bottom:12px; }

/* ---------- Reports ---------- */
#view-reports { flex-direction:column; overflow-y:auto; padding:24px; }
.rpt-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr)); gap:16px; }
.rpt-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px; cursor:pointer; transition:.2s; }
.rpt-card:hover { border-color:var(--accent); transform:translateY(-2px); }
.rpt-card .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.badge { font-size:11.5px; padding:4px 10px; border-radius:20px; }
.badge.success { background:rgba(34,197,94,.14); color:#86efac; }
.badge.running { background:rgba(245,158,11,.14); color:#fcd34d; }
.badge.failed { background:rgba(239,68,68,.14); color:#fca5a5; }
.rpt-card .prompt { font-size:14px; margin-bottom:12px; line-height:1.8; min-height:44px; }
.rpt-card .meta { display:flex; gap:14px; color:var(--muted); font-size:12.5px; }
.ret-pos { color:var(--green); font-weight:700; }
.ret-neg { color:var(--red); font-weight:700; }
.vh { font-size:18px; font-weight:700; margin-bottom:18px; }

/* ---------- Modal (report detail) ---------- */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:50; align-items:center; justify-content:center; padding:20px; }
.modal-bg.open { display:flex; }
.modal { background:var(--panel); border:1px solid var(--border); border-radius:18px; width:100%; max-width:720px; max-height:88vh; overflow-y:auto; padding:26px; }
.modal h3 { margin-bottom:16px; font-size:17px; }
.m-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:14px 0; }
.m-box { background:var(--panel2); border-radius:10px; padding:12px; text-align:center; }
.m-box .v { font-size:17px; font-weight:700; margin-top:4px; }
.m-box .k { color:var(--muted); font-size:12px; }
.m-sec { font-size:14px; font-weight:700; color:var(--muted); margin:18px 0 8px; }
.modal-actions { display:flex; gap:10px; margin-top:20px; }
.modal-actions a, .modal-actions button { flex:1; text-align:center; padding:12px; border-radius:10px; font-family:inherit; font-size:14px; cursor:pointer; border:none; }
.a-pdf { background:var(--green); color:#fff; }
.a-close { background:var(--panel2); color:var(--muted); }
.chart-img { width:100%; border-radius:12px; margin-top:10px; border:1px solid var(--border); }
.spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:60px auto; }
@keyframes spin { to { transform:rotate(360deg); } }

@media (max-width: 760px) {
  .sessions { display:none; }
  .bubble { max-width:92%; }
  nav button { padding:8px 12px; font-size:13px; }
}
</style>
</head>
<body>

<!-- ==================== AUTH ==================== -->
<div id="auth">
  <div class="auth-card">
    <div class="logo">
      <div class="mark">📊</div>
      <h1>Vibe Trading</h1>
      <p>دستیار هوشمند بک‌تست و تحلیل بازار</p>
    </div>
    <div class="tabs">
      <button id="tab-login" class="active" onclick="switchTab('login')">ورود</button>
      <button id="tab-register" onclick="switchTab('register')">ثبت‌نام</button>
    </div>

    <div id="form-login">
      <div class="field">
        <label>نام کاربری</label>
        <input id="li-user" type="text" placeholder="username" autocomplete="username">
      </div>
      <div class="field">
        <label>رمز عبور</label>
        <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-main" id="btn-login" onclick="doLogin()">ورود به داشبورد</button>
    </div>

    <div id="form-register" style="display:none">
      <div class="field">
        <label>نام کاربری</label>
        <input id="rg-user" type="text" placeholder="username">
      </div>
      <div class="field">
        <label>رمز عبور (حداقل ۶ کاراکتر)</label>
        <input id="rg-pass" type="password" placeholder="••••••••">
      </div>
      <div class="field">
        <label>شناسه تلگرام (اختیاری — برای اتصال به ربات)</label>
        <input id="rg-tg" type="text" placeholder="مثلاً 284531640" dir="ltr">
      </div>
      <button class="btn-main" id="btn-register" onclick="doRegister()">ساخت حساب</button>
    </div>

    <div class="msg" id="auth-msg"></div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app">
  <header>
    <div class="hbrand"><span class="mark">📊</span> Vibe Trading</div>
    <nav>
      <button id="nav-chat" class="active" onclick="showView('chat')">💬 چت با AI</button>
      <button id="nav-reports" onclick="showView('reports')">📈 گزارش بک‌تست</button>
    </nav>
    <div class="userbox">
      <div class="avatar" id="avatar">?</div>
      <button class="exit" onclick="logout()">خروج ↩</button>
    </div>
  </header>

  <main>
    <!-- CHAT -->
    <section id="view-chat" class="view active">
      <aside class="sessions">
        <div class="head"><button onclick="newSession()">＋ گفتگوی جدید</button></div>
        <div class="sess-list" id="sess-list"></div>
      </aside>
      <div class="chat-col">
        <div class="chat-log" id="chat-log">
          <div class="empty-hint">
            <div class="big">💬</div>
            <div>یه گفتگو انتخاب کن یا گفتگوی جدید بساز</div>
            <div style="margin-top:8px; font-size:13px;">مثلاً: «یه بکتست روی BTC از ۲۰۲۳ تا ۲۰۲۴ بزن»</div>
          </div>
        </div>
        <div class="chat-input">
          <textarea id="chat-text" rows="1" placeholder="پیام خود را بنویسید..." onkeydown="chatKey(event)"></textarea>
          <button id="btn-send" onclick="sendChat()">ارسال</button>
        </div>
      </div>
    </section>

    <!-- REPORTS -->
    <section id="view-reports" class="view">
      <div class="vh">📈 گزارش‌های بک‌تست</div>
      <div id="rpt-body"><div class="spinner"></div></div>
    </section>
  </main>
</div>

<!-- ==================== MODAL ==================== -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modal"><div class="spinner"></div></div>
</div>

<script>
const API = '';            // same-origin
let TOKEN = localStorage.getItem('vt_token') || '';
let USERNAME = localStorage.getItem('vt_username') || '';
let SESSIONS = [];
let CURR_SESS = null;
let POLLING = null;

// ---------- helpers ----------
async function api(path, opts = {}) {
  const headers = Object.assign({'Content-Type': 'application/json'}, opts.headers || {});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(API + path, {...opts, headers});
  let data = null;
  try { data = await r.json(); } catch { data = {}; }
  if (r.status === 401) { logout(); throw new Error('unauthorized'); }
  if (!r.ok) throw Object.assign(new Error(data.detail || 'خطا'), {status: r.status});
  return data;
}
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const faNum = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const fmtPct = v => v == null ? '—' : (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
const fmtCls = v => v >= 0 ? 'ret-pos' : 'ret-neg';

// ---------- auth ----------
function switchTab(t) {
  $('tab-login').classList.toggle('active', t === 'login');
  $('tab-register').classList.toggle('active', t === 'register');
  $('form-login').style.display = t === 'login' ? '' : 'none';
  $('form-register').style.display = t === 'register' ? '' : 'none';
  $('auth-msg').className = 'msg';
}
function authMsg(text, cls) { const m = $('auth-msg'); m.textContent = text; m.className = 'msg ' + cls; }

async function doLogin() {
  const u = $('li-user').value.trim(), p = $('li-pass').value;
  if (!u || !p) return authMsg('نام کاربری و رمز را وارد کنید', 'error');
  $('btn-login').disabled = true;
  try {
    const r = await api('/api/v1/auth/login', {method:'POST', body: JSON.stringify({username: u, password: p})});
    TOKEN = r.access_token; USERNAME = r.username;
    localStorage.setItem('vt_token', TOKEN); localStorage.setItem('vt_username', USERNAME);
    enterApp();
  } catch (e) { authMsg(e.status === 401 ? 'نام کاربری یا رمز اشتباه است' : e.message, 'error'); }
  $('btn-login').disabled = false;
}

async function doRegister() {
  const u = $('rg-user').value.trim(), p = $('rg-pass').value, tg = $('rg-tg').value.trim();
  if (!u || p.length < 6) return authMsg('نام کاربری و رمز (۶+ کاراکتر) لازم است', 'error');
  $('btn-register').disabled = true;
  try {
    const body = {username: u, password: p};
    if (tg && /^\d+$/.test(tg)) body.telegram_id = parseInt(tg);
    const r = await api('/api/v1/auth/register', {method:'POST', body: JSON.stringify(body)});
    TOKEN = r.access_token; USERNAME = r.username;
    localStorage.setItem('vt_token', TOKEN); localStorage.setItem('vt_username', USERNAME);
    enterApp();
  } catch (e) { authMsg(e.message, 'error'); }
  $('btn-register').disabled = false;
}

function logout() {
  localStorage.removeItem('vt_token'); localStorage.removeItem('vt_username');
  TOKEN = ''; location.reload();
}

function enterApp() {
  $('auth').style.display = 'none';
  $('app').style.display = 'block';
  $('avatar').textContent = (USERNAME || '?')[0].toUpperCase();
  loadSessions();
}

// ---------- views ----------
function showView(v) {
  ['chat', 'reports'].forEach(x => {
    $('view-' + x).classList.toggle('active', x === v);
    $('nav-' + x).classList.toggle('active', x === v);
  });
  if (v === 'reports') loadReports();
}

// ---------- chat ----------
async function loadSessions() {
  try {
    const list = await api('/api/v1/vibe/sessions');
    SESSIONS = Array.isArray(list) ? list : (list.sessions || []);
    const el = $('sess-list');
    if (!SESSIONS.length) { el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:10px;text-align:center">هنوز گفتگویی ندارید</div>'; return; }
    el.innerHTML = SESSIONS.map(s =>
      `<div class="sess-item" data-id="${esc(s.vibe_session_id || s.id)}" onclick="openSession('${esc(s.vibe_session_id || s.id)}')">${esc(s.title || s.name || 'گفتگو')}</div>`
    ).join('');
  } catch (e) { console.error(e); }
}

async function newSession() {
  const title = 'گفتگوی ' + faNum(new Date().toLocaleDateString('fa-IR'));
  try {
    const s = await api('/api/v1/vibe/sessions', {method:'POST', body: JSON.stringify({title})});
    const id = s.vibe_session_id || s.id || s.session_id;
    await loadSessions();
    openSession(id);
  } catch (e) { alert('خطا در ساخت گفتگو: ' + e.message); }
}

async function openSession(id) {
  CURR_SESS = id;
  document.querySelectorAll('.sess-item').forEach(x => x.classList.toggle('active', x.dataset.id === id));
  const log = $('chat-log');
  log.innerHTML = '<div class="spinner"></div>';
  try {
    const msgs = await api(`/api/v1/vibe/sessions/${id}/messages`);
    const list = Array.isArray(msgs) ? msgs : (msgs.messages || []);
    log.innerHTML = list.length ? '' : '<div class="empty-hint"><div class="big">💬</div><div>اولین پیام را بفرست</div></div>';
    list.forEach(m => addBubble(m.role === 'user' || m.role === 'human' ? 'user' : 'bot', m.content || m.text || ''));
    log.scrollTop = log.scrollHeight;
  } catch (e) { log.innerHTML = '<div class="empty-hint">خطا در بارگذاری پیام‌ها</div>'; }
}

function addBubble(cls, text) {
  const log = $('chat-log');
  const hint = log.querySelector('.empty-hint');
  if (hint) hint.remove();
  const b = document.createElement('div');
  b.className = 'bubble ' + cls;
  b.innerHTML = esc(text);
  log.appendChild(b);
  log.scrollTop = log.scrollHeight;
  return b;
}

function chatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

async function sendChat() {
  const ta = $('chat-text');
  const text = ta.value.trim();
  if (!text) return;
  if (!CURR_SESS) { await newSession(); if (!CURR_SESS) return; }

  ta.value = ''; ta.style.height = 'auto';
  addBubble('user', text);
  const typing = addBubble('typing', '🔄 در حال پردازش...');
  $('btn-send').disabled = true;

  try {
    await api(`/api/v1/vibe/sessions/${CURR_SESS}/messages`, {method:'POST', body: JSON.stringify({message: text})});
    // poll for the assistant answer
    let answer = null;
    for (let i = 0; i < 90; i++) {
      await new Promise(r => setTimeout(r, 2000));
      const msgs = await api(`/api/v1/vibe/sessions/${CURR_SESS}/messages`);
      const list = Array.isArray(msgs) ? msgs : (msgs.messages || []);
      const last = list[list.length - 1];
      if (last && last.role !== 'user' && last.role !== 'human' && (last.content || last.text)) {
        answer = last.content || last.text;
        break;
      }
    }
    typing.remove();
    addBubble('bot', answer || '⏰ پاسخ طولانی شد — کمی بعد دوباره چک کن یا از «گزارش بک‌تست» استفاده کن.');
  } catch (e) {
    typing.remove();
    addBubble('bot', '❌ خطا: ' + e.message);
  }
  $('btn-send').disabled = false;
  ta.focus();
}

// ---------- reports ----------
async function loadReports() {
  const el = $('rpt-body');
  el.innerHTML = '<div class="spinner"></div>';
  try {
    const runs = await api('/api/v1/vibe/runs');
    const list = Array.isArray(runs) ? runs : [];
    if (!list.length) { el.innerHTML = '<div class="empty-hint"><div class="big">📭</div><div>هنوز بک‌تستی نداری — از بخش چت شروع کن</div></div>'; return; }
    el.innerHTML = '<div class="rpt-grid">' + list.map(r => {
      const t = r.total_return, s = r.sharpe;
      const hasM = t != null || s != null;
      const badge = r.status === 'success' ? '<span class="badge success">موفق</span>'
                  : r.status === 'running' ? '<span class="badge running">در حال اجرا</span>'
                  : `<span class="badge failed">${esc(r.status)}</span>`;
      return `<div class="rpt-card" onclick="openReport('${esc(r.run_id)}')">
        <div class="top"><span style="color:var(--muted);font-size:12px" dir="ltr">${esc(r.run_id)}</span>${badge}</div>
        <div class="prompt">${esc(r.prompt || '—')}</div>
        <div class="meta">
          ${t != null ? `<span class="${fmtCls(t)}">بازده ${fmtPct(t)}</span>` : ''}
          ${s != null ? `<span>شارپ ${s.toFixed(2)}</span>` : ''}
          <span>${esc(r.start_date || '')} → ${esc(r.end_date || '')}</span>
        </div>
      </div>`;
    }).join('') + '</div>';
  } catch (e) { el.innerHTML = '<div class="empty-hint">❌ ' + esc(e.message) + '</div>'; }
}

async function openReport(runId) {
  $('modal-bg').classList.add('open');
  $('modal').innerHTML = '<div class="spinner"></div>';
  try {
    const d = await api(`/api/v1/vibe/runs/${runId}`);
    const m = d.metrics || {};
    const boxes = [];
    const box = (k, v, cls='') => v != null && boxes.push(`<div class="m-box"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`);
    box('بازده کل', fmtPct(m.total_return), fmtCls(m.total_return || 0));
    box('سالانه', fmtPct(m.annual_return), fmtCls(m.annual_return || 0));
    box('شارپ', m.sharpe != null ? m.sharpe.toFixed(2) : null);
    box('سورتینو', m.sortino != null ? m.sortino.toFixed(2) : null);
    box('حداکثر افت', fmtPct(m.max_drawdown), 'ret-neg');
    box('نرخ برد', m.win_rate != null ? (m.win_rate * 100).toFixed(0) + '%' : null);
    box('معاملات', m.trade_count);
    box('ارزش نهایی', m.final_value != null ? '$' + Number(m.final_value).toLocaleString() : null);

    let chart = '';
    if (d.equity_curve && d.equity_curve.length > 4) {
      chart = `<img class="chart-img" src="/api/v1/vibe/runs/${runId}/chart" onerror="this.style.display='none'">`;
    }

    $('modal').innerHTML = `
      <h3>📊 ${esc(d.prompt || runId)}</h3>
      <div style="color:var(--muted);font-size:12.5px" dir="ltr">${esc(runId)}</div>
      <div class="m-grid">${boxes.join('') || '<div style="color:var(--muted)">متیری ثبت نشده</div>'}</div>
      ${chart}
      <div class="modal-actions">
        ${m.total_return != null ? `<a class="a-pdf" href="/api/v1/vibe/runs/${runId}/pdf" download="backtest_${runId}.pdf">📄 دانلود PDF</a>` : ''}
        <button class="a-close" onclick="closeModal()">بستن</button>
      </div>`;
  } catch (e) {
    $('modal').innerHTML = `<div class="empty-hint">❌ ${esc(e.message)}</div>`;
  }
}
function closeModal() { $('modal-bg').classList.remove('open'); }

// PDF + chart endpoints don't exist yet on gateway — graceful fallback via detail data
// (chart tag errors are hidden; PDF button only rendered if needed endpoint exists)

// ---------- boot ----------
if (TOKEN) { enterApp(); } else { $('auth').style.display = 'flex'; }
$('chat-text').addEventListener('input', function(){ this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
</script>
</body>
</html>
